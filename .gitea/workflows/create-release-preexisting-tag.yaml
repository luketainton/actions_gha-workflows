name: Create Gitea Release Pre-Existing Tag
on:
  workflow_call:
    inputs:
      tag:
        required: true
      body:
        required: false
    secrets:
      ACTIONS_TOKEN:
        required: true

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          TAG_NAME: ${{ inputs.tag }}
          RELEASE_BODY: ${{ inputs.body }}
          API_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: |
          payload=$(jq -n \
            --arg tag_name "$TAG_NAME" \
            --arg name "$TAG_NAME" \
            --arg body "$RELEASE_BODY" \
            '{tag_name: $tag_name, name: $name, body: $body}')
          curl --fail-with-body --silent --show-error --request POST \
            -H "Authorization: token $API_TOKEN" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}/releases"
