name: Docker Compose Deploy Stack

on:
  workflow_call:
    inputs:
      dry-run:
        description: Prepare configuration and commands without SSH, SCP, notifications, or stack changes
        type: boolean
        default: false
      project-directory:
        description: Absolute deployment directory ending in the repository name (empty uses organisation root or /home/user/repo)
        type: string
        default: ''
      data-directory:
        description: Absolute persistent data directory (empty uses organisation data root)
        type: string
        default: ''
      docker-executable:
        description: Docker executable name or absolute path on the target host
        type: string
        default: docker
      ssh-auth:
        description: SSH authentication method (key or password)
        type: string
        default: key
      notifications:
        description: Send Pushover start and completion notifications
        type: boolean
        default: true
      source-files:
        description: Comma-separated repository paths to upload with SCP
        type: string
        default: ./compose.yaml,./.env
      force-recreate:
        type: boolean
        default: false
      remove-orphans:
        type: boolean
        default: false
      create-data-directory:
        description: Create the persistent data directory on the host
        type: boolean
        default: false
      approval-required:
        description: Require manual approval after pulling images and before deploying
        type: boolean
        default: false
      approval-approvers:
        description: Comma-separated users allowed to approve deployment
        type: string
        default: luke
      approval-title:
        type: string
        default: Deploying Compose stack
      approval-body:
        type: string
        default: Please approve or deny this deployment.
      build:
        description: Build images when applying the deployment
        type: boolean
        default: false
      replace-project-directory:
        description: Delete the validated deployment directory before uploading (persistent data remains outside it)
        type: boolean
        default: false
      before-upload:
        description: Optional trusted host shell script run inside the deployment directory before SCP
        type: string
        default: ''
      before-deploy:
        description: Optional trusted host shell script run inside the deployment directory before Compose up
        type: string
        default: ''
    secrets:
      DEPLOY_HOST:
        required: true
      DEPLOY_USERNAME:
        required: true
      DEPLOY_PORT:
        required: true
      DEPLOY_SSHKEY:
        required: false
      DEPLOY_PASSWORD:
        required: false
      PUSHOVER_USER_TOKEN:
        required: false
      PUSHOVER_APP_TOKEN:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "[ON RUNNER] Resolve project paths and commands"
        id: project
        shell: bash
        env:
          PROJECT_NAME: ${{ github.event.repository.name }}
          PROJECT_DIRECTORY: ${{ inputs.project-directory }}
          PROJECT_ROOT: ${{ vars.ACTIVE_PROJECT_DIR }}
          DATA_DIRECTORY: ${{ inputs.data-directory }}
          DATA_ROOT: ${{ vars.ACTIVE_PROJECT_DATA_DIR || vars.PROJECT_DATA_DIR }}
          DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
          DOCKER_EXECUTABLE: ${{ inputs.docker-executable }}
          SSH_AUTH: ${{ inputs.ssh-auth }}
          SSH_CREDENTIAL: ${{ inputs.ssh-auth == 'key' && secrets.DEPLOY_SSHKEY || inputs.ssh-auth == 'password' && secrets.DEPLOY_PASSWORD || '' }}
          CREATE_DATA_DIRECTORY: ${{ inputs.create-data-directory }}
          BUILD: ${{ inputs.build }}
          REPLACE_PROJECT_DIRECTORY: ${{ inputs.replace-project-directory }}
          BEFORE_UPLOAD: ${{ inputs.before-upload }}
          BEFORE_DEPLOY: ${{ inputs.before-deploy }}
          FORCE_RECREATE: ${{ inputs.force-recreate }}
          REMOVE_ORPHANS: ${{ inputs.remove-orphans }}
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import PurePosixPath
          import re
          import shlex

          name = os.environ['PROJECT_NAME']
          folder = os.environ['PROJECT_DIRECTORY'] or (
              os.environ['PROJECT_ROOT'].rstrip('/') + '/' + name
              if os.environ['PROJECT_ROOT'] else '/home/' + os.environ['DEPLOY_USERNAME'] + '/' + name
          )
          data = os.environ['DATA_DIRECTORY'] or (
              os.environ['DATA_ROOT'].rstrip('/') + '/' + name if os.environ['DATA_ROOT'] else ''
          )
          def validate_path(value):
              path = PurePosixPath(value)
              if not path.is_absolute() or '..' in path.parts or len(path.parts) < 3 or any(c in value for c in '\r\n\x00'):
                  raise SystemExit('Project paths must be absolute, below a parent directory, and contain no traversal or newlines')
              return str(path)
          folder = validate_path(folder)
          if PurePosixPath(folder).name != name:
              raise SystemExit('Project directory must end with the calling repository name')
          if data:
              data = validate_path(data)
              if data == folder or PurePosixPath(folder) in PurePosixPath(data).parents:
                  raise SystemExit('Persistent data must be outside the deployment directory')
          if os.environ['SSH_AUTH'] not in ('key', 'password'):
              raise SystemExit('ssh-auth must be key or password')
          if not os.environ['SSH_CREDENTIAL']:
              raise SystemExit('The selected SSH credential is missing')
          docker = os.environ['DOCKER_EXECUTABLE']
          if not re.fullmatch(r'[A-Za-z0-9_./+-]+', docker):
              raise SystemExit('docker-executable must be one executable name or path')
          q = shlex.quote
          compose = q(docker) + ' compose --env-file .env'
          prepare = 'set -eu'
          if os.environ.get('REPLACE_PROJECT_DIRECTORY') == 'true':
              prepare += '\nrm -rf -- ' + q(folder)
          prepare += '\nmkdir -p -- ' + q(folder)
          if os.environ['CREATE_DATA_DIRECTORY'] == 'true':
              if not data:
                  raise SystemExit('Creating the data directory requires data-directory or an organisation data root')
              prepare += '\nmkdir -p -- ' + q(data)
          if os.environ.get('BEFORE_UPLOAD'):
              prepare += '\ncd -- ' + q(folder) + '\n' + os.environ['BEFORE_UPLOAD']
          deploy = 'set -eu\ncd -- ' + q(folder)
          if os.environ.get('BEFORE_DEPLOY'):
              deploy += '\n' + os.environ['BEFORE_DEPLOY']
          deploy += '\n' + compose + ' up --detach'
          if os.environ.get('BUILD') == 'true':
              deploy += ' --build'
          pull = 'set -eu\ncd -- ' + q(folder) + '\n' + q(docker) + ' compose pull'
          if os.environ['FORCE_RECREATE'] == 'true':
              deploy += ' --force-recreate'
          if os.environ['REMOVE_ORPHANS'] == 'true':
              deploy += ' --remove-orphans'
          remove = 'set -eu\ncd -- ' + q(folder) + '\n' + compose + ' down\ncd /\nrm -rf -- ' + q(folder)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'project_name': name, 'project_folder': folder, 'data_folder': data}.items():
                  print(key + '=' + value, file=output)
              for key, value in {'prepare_script': prepare, 'pull_script': pull, 'deploy_script': deploy, 'remove_script': remove}.items():
                  import uuid
                  delimiter = 'COMPOSE_SCRIPT_' + uuid.uuid4().hex
                  print(key + '<<' + delimiter + '\n' + value + '\n' + delimiter, file=output)
          PYCODE

      - name: "[ON RUNNER] Notify deployment start"
        if: inputs.notifications && !inputs.dry-run
        uses: https://git.tainton.uk/actions/pushover-action@v1.3.0
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_TOKEN: ${{ secrets.PUSHOVER_USER_TOKEN }}
        with:
          title: 'Stack Deployment Started'
          message: 'Stack deployment: ${{ github.repository }}'
          url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}'
          url_title: View Logs
          priority: normal
          ttl: 300

      - name: "[ON RUNNER] Check out repository"
        uses: actions/checkout@v7

      - name: "[ON RUNNER] Create Compose environment file"
        shell: bash
        env:
          ALLVARS: ${{ toJSON(vars) }}
          ALLSECRETS: ${{ toJSON(secrets) }}
          PROJECT_NAME: ${{ steps.project.outputs.project_name }}
          PROJECT_FOLDER: ${{ steps.project.outputs.project_folder }}
          PROJECT_DATA_FOLDER: ${{ steps.project.outputs.data_folder }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os

          values = {}
          for source in ('ALLVARS', 'ALLSECRETS'):
              values.update({key: str(value) for key, value in json.loads(os.environ[source]).items() if key.startswith('DC_')})
          values.update({key: os.environ[key] for key in ('PROJECT_NAME', 'PROJECT_FOLDER', 'PROJECT_DATA_FOLDER')})
          os.umask(0o077)
          with open('.env', 'w') as output:
              os.chmod('.env', 0o600)
              for key, value in values.items():
                  if not key.replace('_', '').isalnum() or not key[0].isalpha():
                      raise SystemExit('Invalid Compose environment variable name')
                  encoded = json.dumps(value.replace('$', '$$'), ensure_ascii=False)
                  print(key + '=' + encoded, file=output)
          PYCODE

      - name: "[ON RUNNER] Validate prepared configuration during dry run"
        if: inputs.dry-run
        shell: bash
        env:
          SOURCE_FILES: ${{ inputs.source-files }}
        run: |
          python3 - <<'PYCODE'
          import glob
          import os
          for pattern in os.environ['SOURCE_FILES'].split(','):
              if not glob.glob(pattern):
                  raise SystemExit('Deployment source does not exist: ' + pattern)
          PYCODE
          docker compose --env-file .env config --quiet

      - name: "[ON HOST] Create deployment directories"
        uses: appleboy/ssh-action@v1.2.5
        if: ${{ !inputs.dry-run }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ inputs.ssh-auth == 'key' && secrets.DEPLOY_SSHKEY || '' }}
          password: ${{ inputs.ssh-auth == 'password' && secrets.DEPLOY_PASSWORD || '' }}
          script: ${{ steps.project.outputs.prepare_script }}

      - name: "[ON HOST] Upload deployment files"
        uses: appleboy/scp-action@v1.0.0
        if: ${{ !inputs.dry-run }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ inputs.ssh-auth == 'key' && secrets.DEPLOY_SSHKEY || '' }}
          password: ${{ inputs.ssh-auth == 'password' && secrets.DEPLOY_PASSWORD || '' }}
          source: ${{ inputs.source-files }}
          target: ${{ steps.project.outputs.project_folder }}/

      - name: "[ON HOST] Pull images"
        uses: appleboy/ssh-action@v1.2.5
        if: ${{ !inputs.dry-run }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ inputs.ssh-auth == 'key' && secrets.DEPLOY_SSHKEY || '' }}
          password: ${{ inputs.ssh-auth == 'password' && secrets.DEPLOY_PASSWORD || '' }}
          script: ${{ steps.project.outputs.pull_script }}

      - name: "[ON RUNNER] Wait for deployment approval"
        if: ${{ inputs.approval-required && !inputs.dry-run }}
        timeout-minutes: 60
        uses: trstringer/manual-approval@v1.13.1
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        with:
          secret: ${{ github.token }}
          approvers: ${{ inputs.approval-approvers }}
          minimum-approvals: 1
          issue-title: ${{ inputs.approval-title }}
          issue-body: ${{ inputs.approval-body }}
          exclude-workflow-initiator-as-approver: false
          fail-on-denial: true
          polling-interval-seconds: 5

      - name: "[ON HOST] Deploy stack"
        uses: appleboy/ssh-action@v1.2.5
        if: ${{ !inputs.dry-run }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ inputs.ssh-auth == 'key' && secrets.DEPLOY_SSHKEY || '' }}
          password: ${{ inputs.ssh-auth == 'password' && secrets.DEPLOY_PASSWORD || '' }}
          script: ${{ steps.project.outputs.deploy_script }}

      - name: "[ON RUNNER] Notify deployment completion"
        if: always() && inputs.notifications && !inputs.dry-run
        uses: https://git.tainton.uk/actions/pushover-action@v1.3.0
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_TOKEN: ${{ secrets.PUSHOVER_USER_TOKEN }}
        with:
          title: 'Stack Deployment ${{ job.status }}'
          message: 'Stack deployment: ${{ github.repository }}'
          url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}'
          url_title: View Logs
          priority: normal
          ttl: 300
