name: Unified Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test
        required: false
        type: string
        default: '3.14'
      package-manager:
        description: Dependency and command runner (pip, poetry, or uv)
        required: false
        type: string
        default: uv
      docker-enabled:
        description: Build the repository Docker image and lint its Dockerfile
        required: false
        type: boolean
        default: false
      sonarqube:
        description: Run the SonarQube analysis
        required: false
        type: boolean
        default: false
      security-scan:
        description: Run pip-audit against the installed environment
        required: false
        type: boolean
        default: false
      pyrefly:
        description: Run Pyrefly type checking
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false

concurrency:
  group: unified-python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Python ${{ inputs.python-version }} / ${{ inputs.package-manager }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect OpenSpec-managed PR changes
        id: openspec-changes
        shell: bash
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import subprocess
          import sys

          with open(os.environ["EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)

          pull_request = event.get("pull_request") or event.get("pull_request_target")
          if not pull_request:
              print("changed=false", file=open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"))
              sys.exit(0)

          base = pull_request.get("base", {}).get("sha")
          head = pull_request.get("head", {}).get("sha")
          if not base or not head:
              sys.exit("Unable to determine pull request base/head SHA for OpenSpec path detection")

          result = subprocess.run(
              ["git", "diff", "--no-renames", "--name-only", f"{base}...{head}"],
              check=False,
              capture_output=True,
              text=True,
          )
          if result.returncode:
              sys.exit(f"Unable to compare pull request commits: {result.stderr.strip()}")

          managed = any(
              (path.startswith("openspec/changes/") or path.startswith("openspec/specs/"))
              and not path.endswith("/.gitkeep")
              for path in result.stdout.splitlines()
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"changed={'true' if managed else 'false'}", file=output)
          PYCODE

      - name: Install OpenSpec CLI
        if: steps.openspec-changes.outputs.changed == 'true'
        run: npm install --global @fission-ai/openspec@1.13.2

      - name: Validate OpenSpec PR changes
        if: steps.openspec-changes.outputs.changed == 'true'
        shell: bash
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          with open(os.environ["EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)
          pull_request = event.get("pull_request") or event.get("pull_request_target")
          if not pull_request:
              sys.exit("OpenSpec validation was requested without pull request metadata")

          base = pull_request.get("base", {}).get("sha")
          head = pull_request.get("head", {}).get("sha")
          if not base or not head:
              sys.exit("Unable to determine pull request base/head SHA for OpenSpec validation")

          result = subprocess.run(
              ["git", "diff", "--no-renames", "--name-only", f"{base}...{head}"],
              check=False,
              capture_output=True,
              text=True,
          )
          if result.returncode:
              sys.exit(f"Unable to compare pull request commits: {result.stderr.strip()}")
          paths = result.stdout.splitlines()
          active_ids = set()
          archived_dirs = set()
          archived_specs = {}
          spec_ids = set()

          for changed_path in paths:
              parts = changed_path.split("/")
              if len(parts) >= 3 and parts[0:2] == ["openspec", "changes"]:
                  if parts[2] == "archive" and len(parts) >= 5:
                      archived_dirs.add(parts[3])
                      if len(parts) >= 7 and parts[4] == "specs":
                          capability = "/".join(parts[5:-1])
                          if capability:
                              archived_specs.setdefault(parts[3], set()).add(capability)
                  elif parts[2] != ".gitkeep":
                      active_ids.add(parts[2])
              if len(parts) >= 3 and parts[0:2] == ["openspec", "specs"] and parts[2] != ".gitkeep":
                  spec_ids.add("/".join(parts[2:-1]) if len(parts) > 3 else parts[2])

          def archived_change_id(directory):
              return re.sub(r"^\d{4}-\d{2}-\d{2}-", "", directory)

          def matches_change(change_id, directory):
              return directory == change_id or archived_change_id(directory) == change_id

          for change_id in sorted(active_ids):
              if Path("openspec/changes", change_id).exists():
                  sys.exit(f"OpenSpec change '{change_id}' is still active; archive it before this pull request can pass")
              if not any(matches_change(change_id, directory) for directory in archived_dirs):
                  sys.exit(f"OpenSpec change '{change_id}' was touched but its archived change is not included in this pull request")

          for directory in sorted(archived_dirs):
              if not Path("openspec/changes/archive", directory).is_dir():
                  sys.exit(f"Archived OpenSpec change directory is missing: {directory}")

          for spec_id in sorted(spec_ids):
              if not any(spec_id in archived_specs.get(directory, set()) for directory in archived_dirs):
                  sys.exit(f"OpenSpec capability '{spec_id}' changed without a matching archived delta in this pull request")

          for spec_id in sorted(spec_ids):
              subprocess.run(["openspec", "validate", spec_id, "--type", "spec", "--no-interactive"], check=True)
          archive_result = subprocess.run(
              ["openspec", "validate", "--archived", "--report", "findings", "--json", "--no-interactive"],
              check=False,
              capture_output=True,
              text=True,
          )
          try:
              report = json.loads(archive_result.stdout)
              findings_report = report.get("report", {})
              archive_findings = report.get("itemFindings")
              if findings_report.get("kind") != "validation-findings" or findings_report.get("scope") != "archived" or not isinstance(archive_findings, list):
                  raise ValueError("unexpected archived validation report shape")
              if any(not isinstance(item, dict) or not isinstance(item.get("id"), str) for item in archive_findings):
                  raise ValueError("archived validation finding has no change id")
          except (json.JSONDecodeError, ValueError) as error:
              sys.exit(f"Unable to read archived OpenSpec validation results: {error}")

          relevant_findings = [item for item in archive_findings if item["id"] in archived_dirs]
          if relevant_findings:
              details = "; ".join(
                  f"{item['id']}: {', '.join(issue.get('message', 'validation failed') for issue in item.get('issues', []))}"
                  for item in relevant_findings
              )
              sys.exit(f"PR-touched archived OpenSpec changes are incomplete: {details}")
          if archive_result.returncode and not archive_findings:
              sys.exit(f"Archived OpenSpec validation failed without findings: {archive_result.stderr.strip() or archive_result.stdout.strip()}")
          PYCODE

      - name: Validate package manager
        shell: bash
        run: |
          case "${{ inputs.package-manager }}" in
            pip|poetry|uv) ;;
            *) echo "Unsupported package manager: ${{ inputs.package-manager }}" >&2; exit 1 ;;
          esac

      - name: Set up Python (pip)
        if: ${{ inputs.package-manager == 'pip' }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Set up Python
        if: ${{ inputs.package-manager != 'pip' }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up uv
        if: ${{ inputs.package-manager == 'uv' }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Poetry
        if: ${{ inputs.package-manager == 'poetry' }}
        uses: abatilo/actions-poetry@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.package-manager }}" in
            pip)
              python -m pip install --upgrade pip
              if [[ -f pyproject.toml ]]; then
                python -m pip install -e ".[dev]"
              elif [[ -f requirements.txt ]]; then
                python -m pip install -r requirements.txt
                [[ ! -f requirements-dev.txt ]] || python -m pip install -r requirements-dev.txt
              fi
              ;;
            poetry)
              poetry add --group dev --no-interaction ruff pytest pytest-cov coverage
              poetry install --with dev
              ;;
            uv)
              uv add --dev ruff pytest pytest-cov coverage
              uv sync --dev
              ;;
            *)
              echo "Unsupported package manager: ${{ inputs.package-manager }}" >&2
              exit 1
              ;;
          esac

      - name: Add security scanner to Poetry dev dependencies
        if: ${{ inputs.package-manager == 'poetry' && inputs.security-scan }}
        run: poetry add --group dev --no-interaction pip-audit

      - name: Add security scanner to uv dev dependencies
        if: ${{ inputs.package-manager == 'uv' && inputs.security-scan }}
        run: uv add --dev pip-audit

      - name: Add Pyrefly to Poetry dev dependencies
        if: ${{ inputs.package-manager == 'poetry' && inputs.pyrefly }}
        run: poetry add --group dev --no-interaction pyrefly

      - name: Add Pyrefly to uv dev dependencies
        if: ${{ inputs.package-manager == 'uv' && inputs.pyrefly }}
        run: uv add --dev pyrefly

      - name: Install Pyrefly for pip
        if: ${{ inputs.package-manager == 'pip' && inputs.pyrefly }}
        run: python -m pip install pyrefly

      - name: Install updated dev dependencies
        if: ${{ (inputs.security-scan || inputs.pyrefly) && (inputs.package-manager == 'poetry' || inputs.package-manager == 'uv') }}
        run: |
          case "${{ inputs.package-manager }}" in
            poetry) poetry install --with dev ;;
            uv) uv sync --dev ;;
          esac

      - name: Ruff lint
        run: |
          case "${{ inputs.package-manager }}" in
            pip) python -m ruff check . ;;
            poetry) poetry run ruff check . ;;
            uv) uv run ruff check . ;;
          esac

      - name: Ruff format
        run: |
          case "${{ inputs.package-manager }}" in
            pip) python -m ruff format --check . ;;
            poetry) poetry run ruff format --check . ;;
            uv) uv run ruff format --check . ;;
          esac

      - name: Pyrefly type check
        if: ${{ inputs.pyrefly }}
        run: |
          case "${{ inputs.package-manager }}" in
            pip) pyrefly check ;;
            poetry) poetry run pyrefly check ;;
            uv) uv run pyrefly check ;;
          esac

      - name: Unit tests and coverage
        run: |
          set -euo pipefail
          case "${{ inputs.package-manager }}" in
            pip) python -m coverage run -m pytest -q --junitxml=test-results.xml ;;
            poetry) poetry run coverage run -m pytest -q --junitxml=test-results.xml ;;
            uv) uv run coverage run -m pytest -q --junitxml=test-results.xml ;;
          esac
          case "${{ inputs.package-manager }}" in
            pip) python -m coverage report --fail-under=0; python -m coverage xml -o coverage.xml ;;
            poetry) poetry run coverage report --fail-under=0; poetry run coverage xml -o coverage.xml ;;
            uv) uv run coverage report --fail-under=0; uv run coverage xml -o coverage.xml ;;
          esac

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ inputs.package-manager }}-${{ inputs.python-version }}
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: error

      - name: Dependency audit
        if: ${{ inputs.security-scan }}
        run: |
          case "${{ inputs.package-manager }}" in
            pip) pip-audit ;;
            poetry) poetry run pip-audit ;;
            uv) uv run pip-audit ;;
          esac

      - name: Lint Dockerfile
        if: ${{ inputs.docker-enabled }}
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          output-file: hadolint.out
          format: sonarqube
          no-fail: true

      - name: Build Docker image
        if: ${{ inputs.docker-enabled }}
        run: docker build --tag python-ci:local .

      - name: SonarQube scan
        if: ${{ inputs.sonarqube }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
